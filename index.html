<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>照顧服務員技術稽核</title>
<meta name="description" content="依單元閱讀照顧服務技術稽核題目與簡報，並以關鍵字查詢">
<meta name="theme-color" content="#255c8c">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="照服員稽核">
<style>
:root {
  --bg: #f8f6f0; --panel: #ffffff; --ink: #1f2933; --muted: #5f6b76; --line: #e2ded4;
  --accent: #255c8c; --accent-soft: #e3edf6; --mark: #ffe58a; --stage: #eceae3;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15191d; --panel: #1d2329; --ink: #e6e8ea; --muted: #9aa5af; --line: #2f3740;
    --accent: #7fb3e0; --accent-soft: #23384b; --mark: #6b5a12; --stage: #0f1215; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink);
  font: 16px/1.7 "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
button { font: inherit; color: inherit; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

header { position: sticky; top: 0; z-index: 20; background: var(--accent); color: #fff;
  display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); }
header img { width: 32px; height: 32px; border-radius: 7px; }
header h1 { font-size: 18px; margin: 0; white-space: nowrap; cursor: pointer; }
#menuBtn { display: none; background: none; border: 0; color: #fff; font-size: 22px; padding: 0 4px; cursor: pointer; }
.search { flex: 1; display: flex; max-width: 520px; margin-left: auto; position: relative; }
.search input { width: 100%; border: 0; border-radius: 8px; padding: 8px 34px 8px 12px; font: inherit; font-size: 15px;
  background: rgba(255,255,255,.95); color: #1f2933; }
#clearQ { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none;
  color: #5f6b76; font-size: 18px; cursor: pointer; display: none; }

.layout { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 52px); }
nav { border-right: 1px solid var(--line); background: var(--panel); padding: 12px 8px;
  position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; }
nav .home { display: block; padding: 6px 10px 10px; font-size: 14px; color: var(--muted); }
nav a { display: flex; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 8px;
  color: var(--ink); text-decoration: none; font-size: 15px; line-height: 1.45; }
nav a:hover { background: var(--accent-soft); }
nav a.on { background: var(--accent); color: #fff; }
nav a .n { font-weight: 700; color: var(--accent); min-width: 2.2em; }
nav a.on .n { color: #fff; }
nav a .c { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
nav a.on .c { color: #dbe8f4; }

main { padding: 20px 24px 60px; min-width: 0; max-width: 1100px; }
h2 { font-size: 24px; margin: 0 0 4px; line-height: 1.4; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.sub a { color: var(--accent); }
h3 { font-size: 18px; margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--accent-soft); }

/* 簡報 */
.deck { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stage { position: relative; background: var(--stage); aspect-ratio: 1376 / 768; touch-action: pan-y; user-select: none; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.stage .tap { position: absolute; top: 0; bottom: 0; width: 30%; cursor: pointer; }
.stage .tap.l { left: 0; } .stage .tap.r { right: 0; }
.bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.bar button, .bar a.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 14px;
  cursor: pointer; text-decoration: none; color: var(--ink); font-size: 15px; }
.bar button.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
.bar button:disabled { opacity: .4; cursor: default; }
.bar .count { font-variant-numeric: tabular-nums; min-width: 5.5em; text-align: center; color: var(--muted); }
.bar .sp { flex: 1; }
.thumbs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px 10px; border-top: 1px solid var(--line); }
.thumbs img { height: 54px; aspect-ratio: 1376/768; object-fit: cover; border-radius: 4px; cursor: pointer;
  border: 2px solid transparent; opacity: .7; flex: none; background: var(--stage); }
.thumbs img.on { border-color: var(--accent); opacity: 1; }
.deck:fullscreen { display: flex; flex-direction: column; border-radius: 0; background: #000; }
.deck:fullscreen .stage { flex: 1; aspect-ratio: auto; background: #000; }
.deck:fullscreen .thumbs { display: none; }
.deck:fullscreen .bar { background: var(--panel); }

/* 稽核題目 */
ol.items { list-style: none; padding: 0; margin: 0; }
ol.items li { display: flex; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--panel);
  border: 1px solid var(--line); margin-bottom: 8px; }
ol.items li.hit { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.no { flex: none; width: 2.4em; height: 2.4em; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  font-weight: 700; display: grid; place-items: center; font-size: 14px; }
ol.items ul { margin: 6px 0 0; padding-left: 1.2em; color: var(--ink); }
ol.items ul li { display: list-item; border: 0; background: none; padding: 0; margin: 2px 0; box-shadow: none; }
ol.items ul li.h { list-style: none; margin-left: -1.2em; font-weight: 700; margin-top: 6px; }

/* 首頁卡片、查詢結果 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  text-decoration: none; color: var(--ink); display: block; }
.card:hover { border-color: var(--accent); }
.card img { width: 100%; aspect-ratio: 1376/768; object-fit: cover; display: block; background: var(--stage); }
.card div { padding: 8px 12px 10px; line-height: 1.45; }
.card b { color: var(--accent); margin-right: 6px; }
.card small { display: block; color: var(--muted); margin-top: 2px; }
.res { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.res h4 { margin: 0 0 6px; font-size: 17px; }
.res h4 a { color: var(--accent); text-decoration: none; }
.res .r { display: block; padding: 6px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 15px; }
.res .r:hover { background: var(--accent-soft); }
.res .tag { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 99px; margin-right: 6px;
  background: var(--accent-soft); color: var(--accent); font-weight: 700; white-space: nowrap; }
.res .slidehit { display: flex; gap: 10px; align-items: flex-start; }
.res .slidehit img { width: 112px; flex: none; border-radius: 4px; aspect-ratio: 1376/768; object-fit: cover; }
.empty { color: var(--muted); padding: 20px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 18px; }
.chips button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 3px 12px; cursor: pointer; font-size: 14px; }

@media (max-width: 820px) {
  #menuBtn { display: block; }
  header h1 { font-size: 16px; }
  header img { display: none; }
  .layout { grid-template-columns: 1fr; }
  nav { position: fixed; left: 0; top: 52px; bottom: 0; width: 84%; max-width: 320px; height: auto; z-index: 15;
    transform: translateX(-100%); transition: transform .2s; box-shadow: 4px 0 20px rgba(0,0,0,.2); }
  body.menu nav { transform: none; }
  main { padding: 14px 16px 60px; }
  h2 { font-size: 20px; }
  .bar button, .bar a.btn { padding: 6px 10px; }
  .bar .opt { display: none; }
  .bar .count { min-width: 3.6em; }
  .bar { gap: 6px; padding: 8px; }
  .res .slidehit img { width: 88px; }
}
</style>
</head>
<body>
<header>
  <button id="menuBtn" aria-label="單元選單">☰</button>
  <img src="icons/icon-192.png" alt="">
  <h1 id="homeLink">照顧服務員技術稽核</h1>
  <div class="search">
    <input id="q" type="search" placeholder="查詢關鍵字，如：洗手、41～43、鼻胃管" autocomplete="off">
    <button id="clearQ" aria-label="清除">×</button>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script src="data.js"></script>
<script>
const D = window.AUDIT_DATA;
const $ = s => document.querySelector(s);
const main = $('#main'), nav = $('#nav'), qInput = $('#q');
const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const slideSrc = (u, p) => `slides/${u.no}/${String(p).padStart(2, '0')}.webp`;
const pdfHref = u => encodeURI(u.pdf);
const unitByNo = no => D.units.find(u => u.no === no);
// 查詢時忽略全半形、波浪號與空白差異
// 逐字轉換以保持長度不變（標示關鍵字時位置才對得上）
const norm = s => Array.from(s, c => { const n = c.normalize('NFKC'); return n.length === 1 ? n : c; }).join('')
  .replace(/[~〜～\-–—－‐]/g, '～').toLowerCase();

nav.innerHTML = `<a class="home" href="#">全部單元（${D.units.length}）</a>` + D.units.map(u =>
  `<a href="#u=${u.no}" data-u="${u.no}"><span class="n">${u.no}</span><span>${esc(u.title)}</span><span class="c">${u.items.length} 題</span></a>`).join('');

function highlight(text, terms) {
  let html = esc(text);
  if (!terms.length) return html;
  const n = norm(text);
  const marks = [];
  terms.forEach(t => { let i = 0; while ((i = n.indexOf(t, i)) >= 0) { marks.push([i, i + t.length]); i += t.length; } });
  if (!marks.length) return html;
  marks.sort((a, b) => a[0] - b[0]);
  let out = '', last = 0;
  for (const [s, e] of marks) { if (s < last) continue; out += esc(text.slice(last, s)) + '<mark>' + esc(text.slice(s, e)) + '</mark>'; last = e; }
  return out + esc(text.slice(last));
}

function parseHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  return {u: h.get('u'), p: +h.get('p') || 1, q: h.get('q') || ''};
}
function go(params, replace) {
  const h = new URLSearchParams();
  Object.entries(params).forEach(([k, v]) => v && h.set(k, v));
  const s = '#' + h.toString();
  if (replace) history.replaceState(null, '', s); else location.hash = s;
  if (replace) route();
}

function home() {
  main.innerHTML = `<h2>照顧服務員技術稽核</h2>
    <p class="sub">${esc(D.source)}・共 ${D.units.length} 個單元。點選單元可依題號閱讀稽核項目，並以簡報（上一頁／下一頁）瀏覽說明。
    原始 PDF 亦可至 <a href="${D.drive}" target="_blank" rel="noopener">Google 雲端資料夾</a>。</p>
    <div class="chips">${['洗手', '病人辨識', '圍簾', '41～43', '記錄', '注意事項', '30 度'].map(t => `<button>${t}</button>`).join('')}</div>
    <div class="grid">${D.units.map(u => `<a class="card" href="#u=${u.no}"><img loading="lazy" src="${slideSrc(u, 1)}" alt="">
      <div><b>單元 ${u.no}</b>${esc(u.title)}<small>${u.items.length} 題・簡報 ${u.slides.length} 頁</small></div></a>`).join('')}</div>`;
  main.querySelectorAll('.chips button').forEach(b => b.onclick = () => { qInput.value = b.textContent; doSearch(); });
}

let cur = null;
function unit(u, page, terms) {
  const hitNos = new Set(terms.length ? u.items.filter(it => matches(itemText(it), terms)).map(it => it.no) : []);
  main.innerHTML = `<h2>單元 ${u.no}：${esc(u.title)}</h2>
    <p class="sub">簡報：${esc(u.deck)}・${u.slides.length} 頁・稽核項目 ${u.items.length} 題</p>
    <div class="deck" id="deck">
      <div class="stage"><img id="slide" alt=""><div class="tap l" data-d="-1"></div><div class="tap r" data-d="1"></div></div>
      <div class="bar">
        <button id="prev">◀ 上一頁</button><span class="count" id="count"></span><button id="next" class="pri">下一頁 ▶</button>
        <span class="sp"></span>
        <button id="fs" class="opt">全螢幕</button>
        <a class="btn" href="${pdfHref(u)}" target="_blank" rel="noopener">PDF</a>
      </div>
      <div class="thumbs" id="thumbs">${u.slides.map((_, i) => `<img loading="lazy" src="${slideSrc(u, i + 1)}" data-p="${i + 1}" alt="第 ${i + 1} 頁">`).join('')}</div>
    </div>
    <h3>稽核項目（依題號）</h3>
    <ol class="items">${u.items.map(it => `<li id="i${it.no}" class="${hitNos.has(it.no) ? 'hit' : ''}"><span class="no">${it.no}</span><div>${highlight(it.text, terms)}${
      it.sub ? '<ul>' + it.sub.map(s => `<li class="${s.endsWith('：') ? 'h' : ''}">${highlight(s, terms)}</li>`).join('') + '</ul>' : ''}</div></li>`).join('')}</ol>`;
  cur = {u, page: Math.min(Math.max(page, 1), u.slides.length)};
  $('#prev').onclick = () => show(cur.page - 1);
  $('#next').onclick = () => show(cur.page + 1);
  main.querySelectorAll('.tap').forEach(t => t.onclick = () => show(cur.page + +t.dataset.d));
  $('#thumbs').onclick = e => e.target.dataset.p && show(+e.target.dataset.p);
  $('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('#deck').requestFullscreen?.();
  let x0 = null;
  const stage = main.querySelector('.stage');
  stage.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive: true});
  stage.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(cur.page + (dx < 0 ? 1 : -1)); x0 = null; });
  show(cur.page, true);
  const firstHit = main.querySelector('li.hit');
  if (firstHit && page <= 1) firstHit.scrollIntoView({block: 'center'}); else window.scrollTo(0, 0);
}
function show(p, initial) {
  const {u} = cur;
  if (p < 1 || p > u.slides.length) return;
  cur.page = p;
  $('#slide').src = slideSrc(u, p);
  $('#slide').alt = `${u.deck} 第 ${p} 頁`;
  $('#count').textContent = `${p} / ${u.slides.length}`;
  $('#prev').disabled = p === 1;
  $('#next').disabled = p === u.slides.length;
  main.querySelectorAll('#thumbs img').forEach(im => im.classList.toggle('on', +im.dataset.p === p));
  main.querySelector(`#thumbs img[data-p="${p}"]`)?.scrollIntoView({block: 'nearest', inline: 'nearest'});
  if (p < u.slides.length) new Image().src = slideSrc(u, p + 1); // 預載下一頁
  if (!initial) { const h = parseHash(); go({u: u.no, p: p > 1 ? p : '', q: h.q}, true); }
}

const itemText = it => [it.text, ...(it.sub || [])].join(' ');
const terms = q => norm(q).split(/\s+/).filter(Boolean);
const matches = (text, ts) => { const n = norm(text); return ts.every(t => n.includes(t)); };
function snippet(text, ts) {
  const flat = text.replace(/\s*\n\s*/g, '　');
  const i = Math.max(0, norm(flat).indexOf(ts[0]));
  const s = Math.max(0, i - 30);
  return (s > 0 ? '…' : '') + highlight(flat.slice(s, i + 70), ts) + (i + 70 < flat.length ? '…' : '');
}

function results(q) {
  const ts = terms(q);
  let total = 0;
  const html = D.units.map(u => {
    const its = u.items.filter(it => matches(itemText(it), ts));
    const sl = u.slides.map((t, i) => [t, i + 1]).filter(([t]) => matches(t, ts));
    if (matches(u.title + u.deck, ts) && !its.length && !sl.length) sl.push([u.slides[0], 1]);
    if (!its.length && !sl.length) return '';
    total += its.length + sl.length;
    return `<div class="res"><h4><a href="#u=${u.no}&q=${encodeURIComponent(q)}">單元 ${u.no}：${highlight(u.title, ts)}</a></h4>
      ${its.map(it => `<a class="r" href="#u=${u.no}&q=${encodeURIComponent(q)}"><span class="tag">第 ${it.no} 題</span>${highlight(itemText(it), ts)}</a>`).join('')}
      ${sl.map(([t, p]) => `<a class="r slidehit" href="#u=${u.no}&p=${p}&q=${encodeURIComponent(q)}"><img loading="lazy" src="${slideSrc(u, p)}" alt="">
        <span><span class="tag">簡報 第 ${p} 頁</span>${snippet(t, ts)}</span></a>`).join('')}</div>`;
  }).join('');
  main.innerHTML = `<h2>查詢「${esc(q)}」</h2><p class="sub">找到 ${total} 筆（稽核題目與簡報頁）。多個關鍵字以空白分隔表示同時符合。</p>` +
    (html || '<p class="empty">沒有符合的內容，請換個關鍵字試試。</p>');
  window.scrollTo(0, 0);
}

function route() {
  const {u, p, q} = parseHash();
  qInput.value = q;
  $('#clearQ').style.display = q ? 'block' : 'none';
  document.body.classList.remove('menu');
  nav.querySelectorAll('a[data-u]').forEach(a => a.classList.toggle('on', a.dataset.u === u));
  const un = u && unitByNo(u);
  if (un) {
    if (!cur || cur.u !== un || !document.getElementById('deck')) unit(un, p, q ? terms(q) : []);
    else if (cur.page !== p) show(p, true);
    document.title = `單元 ${un.no} ${un.title}｜照顧服務員技術稽核`;
  } else {
    cur = null;
    if (q) results(q); else home();
    document.title = q ? `查詢：${q}｜照顧服務員技術稽核` : '照顧服務員技術稽核';
  }
}

let timer;
function doSearch() {
  const q = qInput.value.trim();
  go(q ? {q} : {}, false);
}
qInput.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { const q = qInput.value.trim(); cur = null; go(q ? {q} : {}, true); }, 300); });
qInput.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(timer); cur = null; doSearch(); qInput.blur(); } });
$('#clearQ').onclick = () => { qInput.value = ''; cur = null; go({}, false); };
$('#homeLink').onclick = () => { cur = null; go({}, false); };
$('#menuBtn').onclick = () => document.body.classList.toggle('menu');
document.addEventListener('keydown', e => {
  if (!cur || e.target === qInput) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { show(cur.page + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(cur.page - 1); e.preventDefault(); }
});
window.addEventListener('hashchange', route);
route();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
